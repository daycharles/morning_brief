    non_goals:
      - "Test against live APIs (that is T-013)"
      - "Test GitHub Actions workflow YAML syntax"
    context_files:
      - ".agents-work/2026-05-01_morning-brief-system/spec.md"
      - ".agents-work/2026-05-01_morning-brief-system/architecture.md"
    files_expected:
      - "tests/test_jira_fetcher.py"
      - "tests/test_weather_fetcher.py"
      - "tests/test_news_fetcher.py"
      - "tests/test_sports_fetcher.py"
      - "tests/test_mtg_fetcher.py"
      - "tests/test_report_builder.py"
      - "tests/test_http_client.py"
    acceptance_checks:
      - "cmd: pytest tests/ -v --ignore=tests/test_integration.py && echo ALL_UNIT_TESTS_PASSED"
      - "manual: Confirm each fetcher test file tests success path, HTTP error path, and edge case (EC-001 through EC-008 where applicable)"
      - "manual: Confirm test_http_client.py verifies retry count=2, sleep intervals 1s and 2s (mocked), and HTTPS rejection"
      - "manual: Confirm test_report_builder.py asserts metadata footer contains per-source status and ISO-8601 timestamp (AC-011)"
      - "manual: Confirm test_report_builder.py asserts JIRA and News sections render as markdown tables (AC-012)"
