      - "Each fetcher module has at least 4 test cases (success, HTTP error, parse error, edge case)"
      - "http_client retry logic and HTTPS enforcement covered"
      - "report_builder tests cover AC-011 metadata footer and AC-012 markdown rendering"

  - id: T-013
    status: completed
    type: test
    title: "Integration test — full pipeline with test credentials validating output markdown format"
    depends_on:
