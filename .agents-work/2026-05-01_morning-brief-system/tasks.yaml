project:
  name: "Daily Morning Briefing System"
  definition_of_done:
    - "CI green (all tests pass)"
    - "All 12 acceptance criteria in acceptance.json verified"
    - "No hardcoded credentials anywhere in codebase"
    - "README/SETUP.md documents required GitHub Secrets and setup steps"
    - "Generated markdown report renders correctly in GitHub UI"

tasks:
  - id: T-001
    status: completed
    type: chore
    title: "Project scaffold — directory structure, requirements.txt, __init__.py files"
    depends_on: []
    goal: "Create the full project directory layout defined in architecture.md: scripts/fetchers/, scripts/formatters/, scripts/notifiers/, scripts/utils/, tests/. Add __init__.py to each package. Create requirements.txt with 'requests>=2.31.0' and 'pytest>=7.4.0'. Add .gitignore entries for __pycache__, *.pyc, .env, and *.egg-info."
    non_goals:
      - "Write any implementation logic in the created files"
      - "Configure GitHub Actions or CI"
    context_files:
      - ".agents-work/2026-05-01_morning-brief-system/spec.md"
      - ".agents-work/2026-05-01_morning-brief-system/architecture.md"
    files_expected:
      - "scripts/__init__.py"
      - "scripts/fetchers/__init__.py"
      - "scripts/formatters/__init__.py"
      - "scripts/notifiers/__init__.py"
      - "scripts/utils/__init__.py"
      - "tests/__init__.py"
      - "requirements.txt"
      - ".gitignore"
    acceptance_checks:
      - "cmd: python -c \"import scripts.fetchers, scripts.formatters, scripts.notifiers, scripts.utils\" && echo OK"
      - "cmd: cat requirements.txt | grep requests"
      - "cmd: cat requirements.txt | grep pytest"
      - "manual: Verify directory structure matches architecture.md layout exactly"
      - "manual: Confirm .gitignore has entries for __pycache__ and *.pyc"
      - "manual: Verify AC-008 — .agents-work/2026-05-01_morning-brief-system/ directory exists in repo (already exists, confirm no changes made)"
    risk_flags:
      - "none"
    done_when:
      - "All directories and __init__.py files exist per architecture.md layout"
      - "requirements.txt lists requests and pytest with version pins"
      - ".gitignore updated with Python artifact exclusions"
      - "No lint errors"

  - id: T-002
    status: completed
    type: chore
    title: "GitHub Actions workflow YAML — schedule, secrets, Python setup, git commit/push"
    depends_on:
      - "T-001"
    goal: "Create .github/workflows/morning-brief.yml with: schedule cron '0 6 * * *' and workflow_dispatch triggers; ubuntu-latest runner; Python 3.10 setup with pip install -r requirements.txt; env block exposing JIRA_API_TOKEN, JIRA_HOST, NEWSAPI_KEY, SLACK_WEBHOOK_URL from GitHub Secrets; step to run scripts/morning_brief.py; git add/commit/push steps to persist the generated report. Include a separate 'test' job that runs pytest before the morning-brief job."
    non_goals:
      - "Write the Python scripts invoked by the workflow"
      - "Store any credential values in the workflow file"
    context_files:
      - ".agents-work/2026-05-01_morning-brief-system/spec.md"
      - ".agents-work/2026-05-01_morning-brief-system/architecture.md"
    files_expected:
      - ".github/workflows/morning-brief.yml"
    acceptance_checks:
      - "cmd: grep \"cron: '0 6 \\* \\* \\*'\" .github/workflows/morning-brief.yml"
      - "cmd: grep \"workflow_dispatch\" .github/workflows/morning-brief.yml"
      - "cmd: grep \"JIRA_API_TOKEN\" .github/workflows/morning-brief.yml"
      - "cmd: grep \"NEWSAPI_KEY\" .github/workflows/morning-brief.yml"
      - "cmd: grep \"SLACK_WEBHOOK_URL\" .github/workflows/morning-brief.yml"
      - "cmd: grep -E \"secrets\\.JIRA_API_TOKEN|secrets\\.NEWSAPI_KEY\" .github/workflows/morning-brief.yml"
      - "manual: Confirm AC-001 — schedule.cron is '0 6 * * *' and workflow_dispatch is present"
      - "manual: Confirm AC-009 — all secrets are referenced via secrets context, no literal credential values"
      - "manual: Confirm git commit/push steps exist to persist the generated report file"
      - "manual: Confirm Python 3.10+ is specified in setup-python action"
    risk_flags:
      - "security"
    done_when:
      - "Workflow YAML is valid and parseable by GitHub Actions"
      - "Cron schedule matches AC-001 exactly"
      - "All required secrets referenced via secrets.* context only (AC-009)"
      - "Separate test job runs pytest before morning-brief job"
      - "Git commit/push steps present to store generated report"

  - id: T-003
    status: completed
    type: feat
    title: "FetchResult dataclass + http_client utility with timeout, retry, and HTTPS enforcement"
    depends_on:
      - "T-001"
    goal: "Implement scripts/utils/fetch_result.py containing the FetchResult dataclass (source: str, status: str, data: Any, error_message: Optional[str]). Implement scripts/utils/http_client.py with a get() function that enforces 10-second timeout, 2-retry exponential backoff (sleep 1s then 2s) on connection errors/timeouts/5xx, HTTPS URL validation (reject http://), and WARNING-level logging for retries and rate-limit (HTTP 429) responses. Uses requests.Session internally."
    non_goals:
      - "Implement any fetcher or report logic"
      - "Handle authentication — that is each fetcher's responsibility"
    context_files:
      - ".agents-work/2026-05-01_morning-brief-system/spec.md"
      - ".agents-work/2026-05-01_morning-brief-system/architecture.md"
    files_expected:
      - "scripts/utils/fetch_result.py"
      - "scripts/utils/http_client.py"
    acceptance_checks:
      - "cmd: python -c \"from scripts.utils.fetch_result import FetchResult; r = FetchResult('jira','success'); print(r.status)\""
      - "cmd: python -c \"from scripts.utils.http_client import get; print('imported ok')\""
      - "manual: Confirm AC-009 — http_client.get rejects http:// URLs and raises ValueError"
      - "manual: Confirm retry logic sleeps 1s then 2s between attempts (verifiable via unit tests in T-012)"
      - "manual: Confirm FetchResult fields match architecture.md interface contract exactly"
    risk_flags:
      - "security"
    done_when:
      - "FetchResult dataclass importable from scripts.utils.fetch_result"
      - "http_client.get enforces HTTPS, 10s timeout, 2-retry backoff"
      - "HTTP 429 treated as non-retryable with WARNING log"
      - "No credentials or hardcoded values in these modules"
      - "No lint errors (PEP 8)"

  - id: T-004
    status: completed
    type: feat
    title: "JIRA fetcher — active sprint In Progress and New-24h issues with deduplication"
    depends_on:
      - "T-003"
    goal: "Implement scripts/fetchers/jira_fetcher.py with fetch(config: dict) -> FetchResult. Query JIRA REST API v3 endpoint https://{JIRA_HOST}/rest/api/3/search with two JQL queries: (1) status = 'In Progress' AND sprint in openSprints(), (2) created >= -24h. Merge and deduplicate results by issue key. Each issue record must include: key, summary, assignee display name, status. Authenticate with Bearer token from config['jira_api_token']. Handle EC-004 (no active sprint) by returning a FetchResult with data indicating no sprint. Catch all exceptions and return FetchResult(status='failed')."
    non_goals:
      - "Support multiple JIRA projects"
      - "Support pagination beyond default result size"
    context_files:
      - ".agents-work/2026-05-01_morning-brief-system/spec.md"
      - ".agents-work/2026-05-01_morning-brief-system/architecture.md"
    files_expected:
      - "scripts/fetchers/jira_fetcher.py"
    acceptance_checks:
      - "cmd: python -c \"from scripts.fetchers.jira_fetcher import fetch; print('imported ok')\""
      - "manual: Confirm AC-002 — fetch() returns issues with key, summary, assignee, status fields"
      - "manual: Confirm AC-009 — JIRA_API_TOKEN is never hardcoded; read from config dict only"
      - "manual: Confirm AC-010 — any exception caught internally; returns FetchResult(status='failed') without raising"
      - "manual: Confirm EC-004 — no active sprint returns FetchResult with data={'message': 'No active sprint found.'}"
      - "manual: Confirm EC-008 — duplicate keys across both JQL queries appear only once in result"
    risk_flags:
      - "security"
    done_when:
      - "fetch() function signature matches architecture.md contract"
      - "Deduplication by issue key implemented (EC-008)"
      - "No-sprint edge case handled (EC-004)"
      - "All exceptions caught; FetchResult(status='failed') returned on error"
      - "No hardcoded tokens or URLs containing credentials"

  - id: T-005
    status: completed
    type: feat
    title: "Weather fetcher — Open-Meteo LA forecast with High/Low °F and precipitation"
    depends_on:
      - "T-003"
    goal: "Implement scripts/fetchers/weather_fetcher.py with fetch(config: dict) -> FetchResult. Query Open-Meteo API (https://api.open-meteo.com/v1/forecast) with fixed LA coordinates (lat=34.0522, lon=-118.2437), requesting daily temperature_2m_max, temperature_2m_min, and precipitation_probability_max. Convert Celsius to Fahrenheit. Return FetchResult with data containing: high_f, low_f, precipitation_probability. No authentication required. Catch all exceptions and return FetchResult(status='failed')."
    non_goals:
      - "Support configurable locations"
      - "Support OpenWeatherMap fallback (optional per spec)"
    context_files:
      - ".agents-work/2026-05-01_morning-brief-system/spec.md"
      - ".agents-work/2026-05-01_morning-brief-system/architecture.md"
    files_expected:
      - "scripts/fetchers/weather_fetcher.py"
    acceptance_checks:
      - "cmd: python -c \"from scripts.fetchers.weather_fetcher import fetch; print('imported ok')\""
      - "manual: Confirm AC-003 — fetch() returns data with high_f, low_f, precipitation_probability fields"
      - "manual: Confirm AC-010 — exceptions caught internally; FetchResult(status='failed') on error"
      - "manual: Confirm LA coordinates are hardcoded constants (not secrets) per architecture.md"
      - "manual: Confirm temperatures are converted to Fahrenheit (not raw Celsius from Open-Meteo)"
    risk_flags:
      - "none"
    done_when:
      - "fetch() uses Open-Meteo API with LA fixed coords"
      - "Returns high_f, low_f, precipitation_probability in data"
      - "Celsius-to-Fahrenheit conversion applied"
      - "All exceptions caught; graceful failure (AC-010)"

  - id: T-006
    status: completed
