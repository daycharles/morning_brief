  - id: T-009
    status: completed
    type: feat
    title: "Slack notifier — optional Incoming Webhook POST with per-source status summary"
    depends_on:
      - "T-003"
    goal: "Implement scripts/notifiers/slack_notifier.py with post_summary(results: dict, report_filename: str, generated_at: str) -> None. Check for SLACK_WEBHOOK_URL in config/env; if absent, log at INFO level and return immediately (no-op). If present, POST to the webhook URL via http_client.get (or requests.post directly) with a JSON payload containing: report_filename, ISO-8601 UTC generated_at timestamp, and per-source status (✅ success / ❌ failed) for each of the 5 sources. Failure to notify (HTTP error, timeout) MUST log a WARNING and not raise — it must never affect the orchestrator exit code."
    non_goals:
      - "Support Slack OAuth or Bot Token auth"
      - "Post the full markdown report content to Slack"
    context_files:
      - ".agents-work/2026-05-01_morning-brief-system/spec.md"
      - ".agents-work/2026-05-01_morning-brief-system/architecture.md"
    files_expected:
      - "scripts/notifiers/slack_notifier.py"
    acceptance_checks:
      - "cmd: python -c \"from scripts.notifiers.slack_notifier import post_summary; print('imported ok')\""
      - "manual: Confirm AC-009 — SLACK_WEBHOOK_URL is never hardcoded; read from environment only"
      - "manual: Confirm function returns silently when SLACK_WEBHOOK_URL is not set"
      - "manual: Confirm Slack POST payload includes filename, timestamp, and per-source ✅/❌ status"
      - "manual: Confirm webhook POST failure logs WARNING only and does not raise exception"
    risk_flags:
      - "security"
    done_when:
      - "post_summary() is a no-op when SLACK_WEBHOOK_URL absent"
      - "Webhook URL never hardcoded or logged"
      - "Notification failure is non-fatal (WARNING log only)"
      - "Payload includes filename, ISO-8601 timestamp, per-source status"

  - id: T-010
    status: completed
    type: feat
    title: "Report builder — markdown template renderer with all 5 sections and metadata footer"
    depends_on:
      - "T-003"
    goal: "Implement scripts/formatters/report_builder.py with build_report(results: dict[str, FetchResult], generated_at: str) -> str. Render a complete markdown document with clearly labelled H2 sections for: JIRA Sprint Status, Weather, Political Headlines, LA Dodgers, Magic: The Gathering. For each failed FetchResult, render a graceful placeholder message instead of section data. Render JIRA issues as a markdown table (Key | Summary | Assignee | Status). Render news headlines as a markdown table (Title | Source | Date | URL). Render a metadata footer section (H2 ## Report Metadata) with: ISO-8601 UTC generated_at timestamp and per-source status (success/failed/skipped) for all 5 sources. Ensure no env var values are rendered into output."
    non_goals:
      - "Support configurable templates"
      - "Write the file to disk (that is the orchestrator's responsibility)"
    context_files:
      - ".agents-work/2026-05-01_morning-brief-system/spec.md"
