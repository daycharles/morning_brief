      - "Metadata footer includes ISO-8601 UTC timestamp and per-source status (AC-011)"
      - "Markdown tables used for JIRA and News sections (AC-012)"
      - "Graceful placeholders rendered for failed sources (AC-010)"
      - "No hardcoded credential values in output"

  - id: T-011
    status: completed
    type: feat
    title: "Main orchestrator — morning_brief.py startup validation, parallel fetch, file write, exit codes"
    depends_on:
      - "T-004"
      - "T-005"
      - "T-006"
      - "T-007"
      - "T-008"
      - "T-009"
      - "T-010"
    goal: "Implement scripts/morning_brief.py as the main entry point. Steps: (1) validate_config(): read JIRA_API_TOKEN, JIRA_HOST, NEWSAPI_KEY from os.environ; log missing secret names (never values); raise SystemExit(1) if all required secrets absent. (2) Use ThreadPoolExecutor(max_workers=5) to run all 5 fetchers concurrently, each wrapped in try/except. (3) Collect FetchResult objects. (4) Call build_report(results, generated_at) where generated_at is UTC ISO-8601 now. (5) Compute UTC date, construct filename Morning-Brief-YYYY-MM-DD.md, write to .agents-work/2026-05-01_morning-brief-system/. (6) Call post_summary() if SLACK_WEBHOOK_URL set. (7) sys.exit(0) if at least one fetch succeeded; sys.exit(1) if all failed."
