      - "manual: Confirm AC-009 — NEWSAPI_KEY is never hardcoded; read from config dict only"
      - "manual: Confirm AC-010 — exceptions caught; FetchResult(status='failed') on any error"
      - "manual: Confirm published_date is formatted as YYYY-MM-DD (not raw ISO timestamp)"
    risk_flags:
