      - "manual: Confirm AC-011 — output markdown includes '## Report Metadata' footer with ISO-8601 UTC timestamp and per-source status for all 5 sources"
      - "manual: Confirm AC-012 — JIRA table renders with | Key | Summary | Assignee | Status | columns"
      - "manual: Confirm AC-012 — News table renders with | Title | Source | Date | URL | columns"
      - "manual: Confirm failed FetchResult renders placeholder message, not empty section or crash"
      - "manual: Confirm EC-004 text 'No active sprint found.' renders correctly in JIRA section"
      - "manual: Confirm EC-005 text 'No recent Dodgers game available.' renders in Sports section"
      - "manual: Confirm EC-006 text 'No new MTG releases in the last 7 days.' renders in MTG section"
    risk_flags:
